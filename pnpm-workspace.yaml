# The @navara/* packages are not published to npm — they ship as vendored tarballs
# in externals/. pnpm 10+ only reads `overrides` from here (no longer from
# package.json's `pnpm.overrides`), so every transitive @navara dep is redirected
# to its local tarball. Without this, transitive deps like @navara/engine-api are
# looked up on the registry and 404.
overrides:
  "@navara/engine": "file:./externals/navara-engine-0.1.0.tgz"
  "@navara/engine-api": "file:./externals/navara-engine-api-0.1.0.tgz"
  "@navara/engine-worker": "file:./externals/navara-engine-worker-0.1.0.tgz"
  "@navara/engine-font-worker": "file:./externals/navara-engine-font-worker-0.1.0.tgz"
  "@navara/core": "file:./externals/navara-core-0.0.0.tgz"
  "@navara/font": "file:./externals/navara-font-0.0.0.tgz"
  "@navara/three_csm": "file:./externals/navara-three_csm-0.0.0.tgz"
  "@navara/three_api": "file:./externals/navara-three_api-0.0.0.tgz"
  "@navara/three_default_descs": "file:./externals/navara-three_default_descs-0.0.0.tgz"
  "@navara/worker": "file:./externals/navara-worker-0.0.0.tgz"
